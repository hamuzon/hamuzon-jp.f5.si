<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>月見</title>
  <meta name="description" content="秋の夜、月明かりに照らされた山と田んぼとススキの風景。">
  <meta name="author" content="hamusata">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="sky"></canvas>

  <div class="title-wrap" aria-hidden="true">
    <span>お</span><span>月</span><span>見</span>
  </div>

  <div class="tree" aria-hidden="true">
    <div class="tree-crown"></div>
    <div class="tree-trunk"></div>
    <span class="tree-branch tree-branch-one"></span>
    <span class="tree-branch tree-branch-two"></span>
    <span class="tree-branch tree-branch-three"></span>
    <span class="tree-branch tree-branch-four"></span>
    <span class="tree-branch tree-branch-five"></span>
  </div>

  <div class="tree tree-front-two" aria-hidden="true">
    <div class="tree-crown"></div>
    <div class="tree-trunk"></div>
    <span class="tree-branch tree-branch-one"></span>
    <span class="tree-branch tree-branch-three"></span>
  </div>

  <div class="tree tree-front-three" aria-hidden="true">
    <div class="tree-crown"></div>
    <div class="tree-trunk"></div>
    <span class="tree-branch tree-branch-two"></span>
    <span class="tree-branch tree-branch-four"></span>
  </div>

  <div class="tree tree-front-four" aria-hidden="true">
    <div class="tree-crown"></div>
    <div class="tree-trunk"></div>
    <span class="tree-branch tree-branch-one"></span>
    <span class="tree-branch tree-branch-four"></span>
  </div>

  <div class="tree tree-front-five" aria-hidden="true">
    <div class="tree-crown"></div>
    <div class="tree-trunk"></div>
    <span class="tree-branch tree-branch-two"></span>
    <span class="tree-branch tree-branch-three"></span>
  </div>

  <div class="rocks" aria-hidden="true">
    <span class="rock rock-one"></span>
    <span class="rock rock-two"></span>
    <span class="rock rock-three"></span>
    <span class="rock rock-four"></span>
    <span class="rock rock-five"></span>
  </div>

  <div class="mountain-trees" aria-hidden="true">
    <span class="hill-tree hill-tree-one"></span>
    <span class="hill-tree hill-tree-two"></span>
    <span class="hill-tree hill-tree-three"></span>
  </div>

  <div class="engawa" aria-hidden="true">
    <div class="engawa-rail"></div>
    <div class="engawa-floor"></div>
  </div>

  <div class="sanbo-wrap">
    <div class="sanbo-set">
      <div class="dango-tower">
        <div class="dango-row"><span class="dango"></span></div>
        <div class="dango-row"><span class="dango"></span><span class="dango"></span></div>
        <div class="dango-row"><span class="dango"></span><span class="dango"></span><span class="dango"></span></div>
      </div>
      <div class="sanbo-tray"></div>
      <div class="sanbo-skirt"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
